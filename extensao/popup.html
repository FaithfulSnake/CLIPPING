<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <title>Prints com rolagem</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <header>
      <img src="icones/icone-32.png" width="24" height="24" alt="" />
      <h1>Prints com rolagem</h1>
    </header>

    <section id="tela-config">
      <label class="campo">
        <span>Nome da pasta e do ZIP</span>
        <input id="pasta" type="text" maxlength="100" spellcheck="false" autocomplete="off" />
      </label>

      <p id="aviso" class="aviso" hidden></p>

      <button id="iniciar" class="primario" type="button">Iniciar captura</button>

      <details>
        <summary>Opções</summary>
        <label class="linha">
          <span>Sobreposição entre prints</span>
          <span><input id="sobreposicao" type="number" min="0" max="50" step="1" /> %</span>
        </label>
        <label class="linha">
          <span>Espera após cada rolagem</span>
          <span><input id="espera" type="number" min="200" max="10000" step="100" /> ms</span>
        </label>
        <label class="linha">
          <span>Limite de prints</span>
          <span><input id="limite" type="number" min="1" max="2000" step="1" /></span>
        </label>
        <div class="linha">
          <span>Formato</span>
          <span class="radios">
            <label><input type="radio" name="formato" value="png" /> PNG</label>
            <label><input type="radio" name="formato" value="jpeg" /> JPEG</label>
          </span>
        </div>
        <label class="check">
          <input id="esconderFixos" type="checkbox" />
          <span>Esconder cabeçalhos e rodapés fixos a partir do 2º print</span>
        </label>
        <label class="check">
          <input id="incluirInfo" type="checkbox" />
          <span>Incluir <code>info.txt</code> com o endereço da página</span>
        </label>
        <label class="check">
          <input id="baixarAuto" type="checkbox" />
          <span>Baixar o ZIP automaticamente ao terminar</span>
        </label>
        <button id="restaurar" class="link" type="button">Voltar às opções padrão</button>
      </details>

      <p class="dica">
        Não troque de aba nem minimize a janela durante a captura (se trocar, ela pausa e continua quando você voltar).
        <span id="atalho"></span>
      </p>
    </section>

    <section id="tela-progresso" hidden>
      <p id="status" class="status" role="status" aria-live="polite">Preparando…</p>
      <progress id="barra" max="100" value="0"></progress>
      <button id="parar" type="button">Parar e salvar o que já foi capturado</button>
      <button id="nova" class="primario" type="button" hidden>Nova captura</button>
    </section>

    <script type="module" src="popup.js"></script>
  </body>
</html>
